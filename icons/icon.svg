<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fec659" />
      <stop offset="50%" stop-color="#c9972e" />
      <stop offset="100%" stop-color="#7c5800" />
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#33553a" />
      <stop offset="100%" stop-color="#142a1a" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background Shield -->
  <rect width="512" height="512" rx="128" fill="url(#emeraldGrad)"/>
  
  <!-- Outer Ring -->
  <circle cx="256" cy="256" r="210" fill="none" stroke="url(#goldGrad)" stroke-width="10" stroke-dasharray="16 8"/>
  <circle cx="256" cy="256" r="190" fill="none" stroke="#fec659" stroke-width="3" opacity="0.6"/>

  <!-- Mountain Peak (Puncak 1M) -->
  <path d="M 256 100 L 370 330 L 142 330 Z" fill="url(#goldGrad)" filter="url(#shadow)"/>
  <path d="M 256 100 L 256 330 L 370 330 Z" fill="#7c5800" opacity="0.3"/>

  <!-- Flag at Apex -->
  <path d="M 256 100 L 256 60 L 300 75 L 256 90" fill="#fec659"/>
  <line x1="256" y1="60" x2="256" y2="110" stroke="#fec659" stroke-width="4" stroke-linecap="round"/>

  <!-- 1M Banner -->
  <rect x="136" y="350" width="240" height="70" rx="35" fill="#fec659" filter="url(#shadow)"/>
  <text x="256" y="398" font-family="'Playfair Display', Georgia, serif" font-size="42" font-weight="900" fill="#1c3e25" text-anchor="middle" letter-spacing="2">PROJECT 1M</text>

  <!-- Stars -->
  <circle cx="190" cy="180" r="6" fill="#fec659"/>
  <circle cx="322" cy="180" r="6" fill="#fec659"/>
  <circle cx="160" cy="240" r="4" fill="#fec659"/>
  <circle cx="352" cy="240" r="4" fill="#fec659"/>
</svg>
